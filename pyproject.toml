[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-biogas-flex"
version = "0.1.0"
description = "Flexible operation of an agricultural biogas CHP plant on Polish (and German) day-ahead prices: MILP dispatch, realizable forecast strategy, CHP oversizing and gas storage economics, support-scheme scenarios."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "requests>=2.31",
    "matplotlib>=3.8",
    "pse-opendata @ git+https://github.com/kwwaleszczynski-del/pse-opendata@8b01ec882b6f3af9c9ea91308293dda64108d705",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
biogas-flex = "biogas_flex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biogas_flex = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
